<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gesture Air Canvas ✋🎨</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video, #output-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror like phone camera preview */
    }
    #output-canvas {
      z-index: 2;
    }
    #video {
      z-index: 1;
    }
    #controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
    }
    #clear {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    #clear:hover { background: #c0392b; }
    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>

    <div id="controls">
      <div class="color-btn" style="background:blue;"    data-color="blue"></div>
      <div class="color-btn" style="background:green;"  data-color="green"></div>
      <div class="color-btn" style="background:red;"    data-color="red"></div>
      <div class="color-btn" style="background:yellow;" data-color="yellow"></div>
      <button id="clear">CLEAR</button>
    </div>

    <div id="info">
      Index finger up → Draw&nbsp;&nbsp;|&nbsp;&nbsp;
      Two fingers → Select color&nbsp;&nbsp;|&nbsp;&nbsp;
      Move over palette to change color
    </div>
  </div>

  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clear');

    let currentColor = 'yellow';
    let drawing = false;
    let lastX = null;
    let lastY = null;

    // Mirror canvas context (because we mirror video)
    ctx.scale(-1, 1);
    ctx.translate(-canvas.width, 0);

    // Resize canvas to match window
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Color buttons
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentColor = btn.dataset.color;
        btn.style.border = '4px solid white';
        setTimeout(() => btn.style.border = '3px solid white', 300);
      });
    });

    // Clear canvas
    clearBtn.addEventListener('click', () => {
      ctx.clearRect(-canvas.width, 0, canvas.width*2, canvas.height);
    });

    const hands = new Hands({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({image: video});
      },
      width: 1280,
      height: 720
    });
    camera.start();

    function onResults(results) {
      // Mirror video frame (we already mirrored context)
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);           // reset
      ctx.scale(-1, 1);
      ctx.translate(-canvas.width, 0);
      ctx.clearRect(-canvas.width, 0, canvas.width*2, canvas.height);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      // Draw hand landmarks & connections
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(ctx, landmarks, HAND_CONNECTIONS,
                         {color: '#00ff00', lineWidth: 3});
          drawLandmarks(ctx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 4});

          // ──────────────── Gesture logic ────────────────
          const indexTip   = landmarks[8];   // index finger tip
          const indexPip   = landmarks[6];
          const middleTip  = landmarks[12];
          const middlePip  = landmarks[10];
          const thumbTip   = landmarks[4];

          // Convert normalized coords → pixel (flipped x)
          const x = (1 - indexTip.x) * canvas.width;   // flip x
          const y = indexTip.y * canvas.height;

          // Simple gesture: index up & middle down → drawing mode
          const indexUp = indexTip.y < indexPip.y;
          const middleUp = middleTip.y < middlePip.y;

          if (indexUp && !middleUp) {
            drawing = true;
          } else {
            drawing = false;
            lastX = null;
            lastY = null;
          }

          // Color selection (when two fingers up near top of screen)
          if (indexUp && middleUp) {
            if (y < 100) {  // top bar area
              // rough zones (you can improve with better hit detection)
              if (x < canvas.width * 0.2) currentColor = 'blue';
              else if (x < canvas.width * 0.4) currentColor = 'green';
              else if (x < canvas.width * 0.6) currentColor = 'red';
              else if (x < canvas.width * 0.8) currentColor = 'yellow';
            }
          }

          // Draw line if allowed
          if (drawing && lastX !== null) {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.stroke();
          }

          lastX = x;
          lastY = y;
        }
      }
    }
  </script>
</body>
</html>
