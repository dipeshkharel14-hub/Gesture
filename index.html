<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gesture Air Canvas ✋🎨 – Mirror Fixed</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video, #output-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #video {
      transform: scaleX(-1); /* keep mirror view (most intuitive) */
      z-index: 1;
    }
    #output-canvas {
      z-index: 2;
    }
    #controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .color-btn, .shape-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      text-align: center;
      line-height: 40px;
      font-size: 20px;
    }
    .color-btn {
      background: var(--color);
    }
    .shape-btn {
      background: #fff;
      color: #000;
    }
    #clear {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    #clear:hover { background: #c0392b; }
    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      z-index: 10;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>

    <div id="controls">
      <div class="color-btn" style="--color:blue;"    data-color="blue"></div>
      <div class="color-btn" style="--color:green;"  data-color="green"></div>
      <div class="color-btn" style="--color:red;"    data-color="red"></div>
      <div class="color-btn" style="--color:yellow;" data-color="yellow"></div>
      <div class="shape-btn" data-shape="circle">○</div>
      <div class="shape-btn" data-shape="square">□</div>
      <div class="shape-btn" data-shape="triangle">△</div>
      <div class="shape-btn" data-shape="cube">❒</div>
      <button id="clear">CLEAR</button>
    </div>

    <div id="info">
      Index finger up → Draw / Place shape<br>
      Two fingers up → Select color or shape from top bar<br>
      Pinch (thumb ↔ index) → Grab and move shapes<br>
      <strong>Fixed:</strong> Moving hand right now moves drawing right (natural mirror behavior)
    </div>
  </div>

  <!-- MediaPipe Hand tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clear');

    let currentColor = 'yellow';
    let currentShape = null;
    let drawings = [];
    let currentPath = null;
    let selectedObject = null;
    let wasPinching = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.querySelectorAll('.color-btn, .shape-btn').forEach(el => {
      el.addEventListener('click', () => {
        if (el.dataset.color) {
          currentColor = el.dataset.color;
          currentShape = null;
        } else if (el.dataset.shape) {
          currentShape = el.dataset.shape;
        }
      });
    });

    clearBtn.addEventListener('click', () => {
      drawings = [];
    });

    const hands = new Hands({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({image: video});
      },
      width: 1280,
      height: 720
    });
    camera.start();

    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      renderDrawings();

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        // Use RAW (non-flipped) landmarks → matches mirrored video perfectly
        const landmarks = results.multiHandLandmarks[0];

        drawConnectors(ctx, landmarks, HAND_CONNECTIONS,
          {color: '#00ff9d', lineWidth: 5});
        drawLandmarks(ctx, landmarks, {
          color: '#ffffff',
          fillColor: '#ff5252',
          lineWidth: 2,
          radius: (data) => data.from.z < -0.01 ? 6 : 4
        });

        const indexTip   = landmarks[8];
        const indexPip   = landmarks[6];
        const middleTip  = landmarks[12];
        const middlePip  = landmarks[10];
        const thumbTip   = landmarks[4];

        const cursorX = indexTip.x * canvas.width;
        const cursorY = indexTip.y * canvas.height;

        const indexUp  = indexTip.y < indexPip.y - 0.015;
        const middleUp = middleTip.y < middlePip.y - 0.015;

        // Pinch detection
        const pinchDist = Math.hypot(
          thumbTip.x * canvas.width - cursorX,
          thumbTip.y * canvas.height - cursorY
        );
        const isPinching = pinchDist < 45;

        // ─── Pinch logic ───────────────────────────────────────
        if (isPinching && !wasPinching) {
          selectedObject = null;
          for (let i = drawings.length - 1; i >= 0; i--) {
            const obj = drawings[i];
            if (obj.type !== 'path') {
              const d = Math.hypot(obj.x - cursorX, obj.y - cursorY);
              if (d < (obj.size || 70)) {
                selectedObject = obj;
                break;
              }
            }
          }

          if (!selectedObject && currentShape) {
            drawings.push({
              type: currentShape,
              x: cursorX,
              y: cursorY,
              size: 110,
              color: currentColor
            });
          }
        }

        if (selectedObject && isPinching) {
          selectedObject.x = cursorX;
          selectedObject.y = cursorY;
        }

        if (!isPinching && wasPinching) {
          selectedObject = null;
        }
        wasPinching = isPinching;

        // ─── Selection mode (two fingers up) ──────────────────
        if (indexUp && middleUp) {
          if (cursorY < 140) {
            const f = cursorX / canvas.width;
            if      (f < 0.14) { currentColor = 'blue';   currentShape = null; }
            else if (f < 0.28) { currentColor = 'green';  currentShape = null; }
            else if (f < 0.42) { currentColor = 'red';    currentShape = null; }
            else if (f < 0.56) { currentColor = 'yellow'; currentShape = null; }
            else if (f < 0.70) { currentShape = 'circle'; }
            else if (f < 0.84) { currentShape = 'square'; }
            else               { currentShape = 'triangle'; } // last two share zone
          }
        }
        // ─── Free drawing ─────────────────────────────────────
        else if (indexUp && !middleUp && !currentShape && !isPinching) {
          if (!currentPath) {
            currentPath = { type: 'path', color: currentColor, points: [], lineWidth: 12 };
            drawings.push(currentPath);
          }
          currentPath.points.push({ x: cursorX, y: cursorY });
        } else {
          currentPath = null;
        }
      }
    }

    function renderDrawings() {
      drawings.forEach(obj => {
        ctx.save();
        ctx.strokeStyle = obj.color;
        ctx.fillStyle   = obj.color;
        ctx.lineWidth   = obj.lineWidth || 6;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';

        if (obj.type === 'path') {
          if (obj.points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(obj.points[0].x, obj.points[0].y);
            for (let i = 1; i < obj.points.length; i++) {
              ctx.lineTo(obj.points[i].x, obj.points[i].y);
            }
            ctx.stroke();
          }
        } else if (obj.type === 'circle') {
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.size / 2, 0, Math.PI * 2);
          ctx.stroke();
        } else if (obj.type === 'square') {
          ctx.beginPath();
          ctx.rect(obj.x - obj.size/2, obj.y - obj.size/2, obj.size, obj.size);
          ctx.stroke();
        } else if (obj.type === 'triangle') {
          const s = obj.size / 2;
          ctx.beginPath();
          ctx.moveTo(obj.x, obj.y - s);
          ctx.lineTo(obj.x - s * 0.866, obj.y + s * 0.5);
          ctx.lineTo(obj.x + s * 0.866, obj.y + s * 0.5);
          ctx.closePath();
          ctx.stroke();
        } else if (obj.type === 'cube') {
          const s = obj.size / 2;
          const off = s * 0.45;
          ctx.beginPath();
          ctx.rect(obj.x - s, obj.y - s, obj.size, obj.size);           // front
          ctx.moveTo(obj.x - s, obj.y - s);
          ctx.lineTo(obj.x - s + off, obj.y - s - off);
          ctx.lineTo(obj.x + s + off, obj.y - s - off);
          ctx.lineTo(obj.x + s, obj.y - s);
          ctx.closePath();                                              // top
          ctx.moveTo(obj.x + s, obj.y - s);
          ctx.lineTo(obj.x + s + off, obj.y - s - off);
          ctx.lineTo(obj.x + s + off, obj.y + s - off);
          ctx.lineTo(obj.x + s, obj.y + s);
          ctx.closePath();                                              // right
          ctx.stroke();
        }
        ctx.restore();
      });
    }
  </script>
</body>
</html>
