<!DOCTYPE html>
<html>
<head>
  <title>Air Draw Cinematic</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial;
      color: #00ffcc;
    }

    video, canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .hud {
      position: fixed;
      top: 25px;
      left: 25px;
      background: rgba(0,0,0,0.45);
      border: 1px solid #00ffcc;
      padding: 15px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px #00ffcc22;
    }

    button {
      background: transparent;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 8px;
      width: 180px;
      cursor: pointer;
      margin-top: 10px;
    }

    input[type="range"] {
      width: 180px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<!-- Persistent Drawing -->
<canvas id="drawCanvas"></canvas>

<!-- Skeleton Overlay -->
<canvas id="overlayCanvas"></canvas>

<div class="hud">
  Brush Size<br>
  <input type="range" id="size" min="2" max="35" value="10"><br>
  <button id="save">Save Drawing</button>
</div>

<script>
const video = document.getElementById('video');
const drawCanvas = document.getElementById('drawCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');

const drawCtx = drawCanvas.getContext('2d');
const overlayCtx = overlayCanvas.getContext('2d');

function resizeCanvas() {
  drawCanvas.width = overlayCanvas.width = window.innerWidth;
  drawCanvas.height = overlayCanvas.height = window.innerHeight;
}
resizeCanvas();
window.onresize = resizeCanvas;

let brushSize = 10;
let drawColor = "#ff00ff";

document.getElementById('size').oninput = e => brushSize = e.target.value;

document.getElementById('save').onclick = () => {
  const link = document.createElement('a');
  link.download = "cinematic-air-draw.png";
  link.href = drawCanvas.toDataURL();
  link.click();
};

/* ✨ Motion Smoothing Engine */
let smoothX = null;
let smoothY = null;

const SMOOTHING = 0.65;   // higher = smoother
const INTERPOLATION = 4;  // fills gaps

function smoothPosition(x, y) {
  if (smoothX === null) {
    smoothX = x;
    smoothY = y;
  } else {
    smoothX = smoothX * SMOOTHING + x * (1 - SMOOTHING);
    smoothY = smoothY * SMOOTHING + y * (1 - SMOOTHING);
  }
  return { x: smoothX, y: smoothY };
}

/* Neon Ink Renderer */
function drawNeonLine(x1, y1, x2, y2) {
  drawCtx.strokeStyle = drawColor;
  drawCtx.lineWidth = brushSize;
  drawCtx.lineCap = "round";

  drawCtx.shadowBlur = 30;
  drawCtx.shadowColor = drawColor;

  drawCtx.beginPath();
  drawCtx.moveTo(x1, y1);
  drawCtx.lineTo(x2, y2);
  drawCtx.stroke();

  drawCtx.shadowBlur = 0;
}

let prevPoint = null;

/* MediaPipe */
const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.8,
  minTrackingConfidence: 0.8,
  modelComplexity: 1
});

hands.onResults(results => {

  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  if (!results.multiHandLandmarks) {
    prevPoint = null;
    smoothX = smoothY = null;
    return;
  }

  const landmarks = results.multiHandLandmarks[0];

  const index = landmarks[8];
  const middle = landmarks[12];
  const thumb = landmarks[4];

  const rawX = index.x * drawCanvas.width;
  const rawY = index.y * drawCanvas.height;

  const mx = middle.x * drawCanvas.width;
  const my = middle.y * drawCanvas.height;

  const tx = thumb.x * drawCanvas.width;
  const ty = thumb.y * drawCanvas.height;

  const drawDist = Math.hypot(mx - rawX, my - rawY);
  const eraseDist = Math.hypot(tx - rawX, ty - rawY);

  const smoothed = smoothPosition(rawX, rawY);

  /* ✏️ Cinematic Smooth Drawing */
  if (drawDist < 35) {
    if (prevPoint) {

      // Interpolate between frames (removes jumpiness)
      for (let i = 1; i <= INTERPOLATION; i++) {
        const ix = prevPoint.x + (smoothed.x - prevPoint.x) * (i / INTERPOLATION);
        const iy = prevPoint.y + (smoothed.y - prevPoint.y) * (i / INTERPOLATION);
        drawNeonLine(prevPoint.x, prevPoint.y, ix, iy);
      }
    }
    prevPoint = smoothed;
  }

  /* 🧽 Smooth Eraser */
  else if (eraseDist < 35) {
    drawCtx.clearRect(smoothed.x - 50, smoothed.y - 50, 100, 100);
    prevPoint = null;
  }

  else {
    prevPoint = null;
  }

  /* 🖐 Premium Skeleton Sensors */
  drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS,
    {color: '#00ffcc', lineWidth: 1});

  drawLandmarks(overlayCtx, landmarks,
    {color: '#00ffcc', lineWidth: 1});
});

const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({image: video});
  }
});

camera.start();
</script>

</body>
</html>
